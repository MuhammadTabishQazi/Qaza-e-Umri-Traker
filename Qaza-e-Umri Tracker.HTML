<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qaza-e-Umri Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--surface:#fbfcfb;--ink:#14302c;--muted:#5b726d;--line:#d3dedb;--accent:#1f6f62;--accent-ink:#fff;--lamp:#b87510;--track:#dbe6e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1d;--surface:#162b28;--ink:#e6efec;--muted:#8fa8a2;--line:#28403c;--accent:#5cc2ae;--accent-ink:#0f1f1d;--lamp:#e0a23c;--track:#244039}}
:root[data-theme="dark"]{--bg:#0f1f1d;--surface:#162b28;--ink:#e6efec;--muted:#8fa8a2;--line:#28403c;--accent:#5cc2ae;--accent-ink:#0f1f1d;--lamp:#e0a23c;--track:#244039}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,.serif{font-family:"Newsreader",Georgia,serif;font-weight:600;letter-spacing:-.01em}
main{max-width:880px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.25rem;margin:0 0 12px}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.ring{position:relative;width:220px;height:220px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-family:"Newsreader",Georgia,serif;font-size:2.8rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.lbl{color:var(--muted);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
.stats b{display:block;font-size:1.35rem;font-family:"Newsreader",Georgia,serif;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.85rem}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{flex:1;font-weight:500;font-size:1.05rem}
.cnt{min-width:2ch;text-align:center;font-family:"Newsreader",Georgia,serif;font-size:1.4rem;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.round{width:42px;padding:0;font-size:1.3rem;border-radius:50%}
.round.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.round:disabled{opacity:.35;cursor:not-allowed}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--lamp);border-radius:99px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips input{width:90px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form label{display:block;font-size:.9rem;font-weight:500}
.form label small{display:block;color:var(--muted);font-weight:400;margin-bottom:4px}
.preview{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:16px;text-align:center}
.note{font-size:.85rem;color:var(--muted);margin-top:16px}
.hist{display:grid;grid-template-columns:110px repeat(5,1fr) 40px;gap:4px;font-size:.9rem;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist.h{color:var(--muted);font-size:.8rem;border-top:0}
.hist div:not(:first-child){text-align:center}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;min-height:0}
.empty{color:var(--muted)}
@media(max-width:640px){.hero{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hist{grid-template-columns:70px repeat(5,1fr) 32px;font-size:.8rem}.hist.h div{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var P=["Fajr","Dhuhr","Asr","Maghrib","Isha"],KEY="qaza-tracker-v1";
var mem=null,S;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load()||{setup:false,total:0,target:5,log:{}};
var editing=false,confirmReset=false,calc={obl:"",cur:"",ex:"0",done:"0",manual:""};
function dk(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function day(k){return S.log[k]||[0,0,0,0,0]}
function done(){return (S.prior||0)+Object.keys(S.log).reduce(function(t,k){return t+sum(S.log[k])},0)}
function num(v){return Math.max(0,parseFloat(v)||0)}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
function computed(){var y=Math.max(0,num(calc.cur)-num(calc.obl)-num(calc.ex));return{years:y,total:calc.manual!==""?Math.round(num(calc.manual)):Math.round(y*365*5)}}
function range(days){var t=0,n=new Date();for(var i=0;i<days;i++){var d=new Date(n);d.setDate(n.getDate()-i);t+=sum(day(dk(d)))}return t}
function streak(){var n=new Date(),s=0,i=sum(day(dk(n)))>0?0:1;for(;;i++){var d=new Date(n);d.setDate(n.getDate()-i);if(sum(day(dk(d)))>0)s++;else break}return s}
function eta(rem){if(rem<=0)return"All done";var t=Math.max(1,S.target),days=Math.ceil(rem/t),d=new Date();d.setDate(d.getDate()+days);
var y=Math.floor(days/365),m=Math.floor((days%365)/30),txt=y?y+" yr "+m+" mo":m?m+" mo "+(days%30)+" d":days+" days";
return txt+" · "+d.toLocaleDateString("en-GB",{month:"short",year:"numeric"})}
function bump(i,dl){var k=dk(),a=day(k).slice(),rem=S.total-done();if(dl>0&&rem<=0)return;if(dl<0&&a[i]<=0)return;a[i]+=dl;S.log[k]=a;if(sum(a)===0)delete S.log[k];save();render()}
function setupView(){var c=computed();
return '<header><div><h1>Qaza-e-Umri tracker</h1><p class="sub">Set your starting numbers. You can change them any time.</p></div></header>'+
'<div class="card"><h2>Estimate your qaza</h2><div class="form">'+
f("obl","Age when salah became obligatory for you","e.g. 15","0.5")+f("cur","Your current age","e.g. 30","0.5")+
f("ex","Years to exclude","Periods when prayers were not required, or already prayed","0.5")+f("done","Already made up (prayers)","Qaza prayers you have already completed","1")+
f("manual","Set total manually (optional)","Overrides the estimate if you follow a different method","1")+
'<div class="preview"><div class="lbl">Estimated qaza prayers</div><div class="big">'+fmt(c.total)+'</div><div class="lbl">'+(calc.manual!==""?'Manual total':fmt(c.years*100)/100+' years × 365 days × 5 prayers')+'</div></div></div>'+
'<div class="foot" style="margin-top:16px"><button class="btn-p" data-a="start"'+(c.total<=0?' disabled':'')+'>'+(S.setup?'Save changes':'Start tracking')+'</button>'+(S.setup?'<button data-a="cancel">Cancel</button>':'')+'</div>'+
'<p class="note">This is a tracking tool with an estimate, not a fatwa. Methods of calculating qaza differ between schools and scholars, so adjust the numbers to match the method you follow.</p></div>'}
function f(id,l,s,st){return '<div><label for="'+id+'">'+l+'<small>'+s+'</small></label><input id="'+id+'" data-f="'+id+'" type="number" min="0" step="'+st+'" inputmode="decimal" value="'+calc[id]+'"></div>'}
function dashView(){var dn=done(),rem=Math.max(0,S.total-dn),pct=S.total?dn/S.total*100:0,k=dk(),td=day(k),tt=sum(td),tg=Math.max(1,S.target),R=96,C=2*Math.PI*R;
var ring='<div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="14"/><circle cx="110" cy="110" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-Math.min(1,pct/100)))+'"/></svg><div class="c"><div class="lbl">Remaining</div><div class="big">'+fmt(rem)+'</div><div class="lbl">'+pct.toFixed(1)+'% complete</div></div></div>';
var h='<header><div><h1>Qaza-e-Umri tracker</h1><p class="sub">'+new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</p></div><button data-a="edit">Edit setup</button></header>';
h+='<div class="card hero">'+ring+'<div class="stats"><div><b>'+fmt(S.total)+'</b><span>Total qaza</span></div><div><b>'+fmt(dn)+'</b><span>Completed</span></div><div><b>'+range(7)+'</b><span>Last 7 days</span></div><div><b>'+range(30)+'</b><span>Last 30 days</span></div><div><b>'+streak()+' day'+(streak()===1?'':'s')+'</b><span>Current streak</span></div><div><b style="font-size:1.05rem">'+eta(rem)+'</b><span>Estimated finish at your daily target</span></div></div></div>';
h+='<div class="card"><h2>Today</h2><div class="lbl">'+tt+' of '+tg+' qaza prayers</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+tg+'" aria-valuenow="'+tt+'"><i style="width:'+Math.min(100,tt/tg*100)+'%"></i></div>';
P.forEach(function(p,i){h+='<div class="row"><span class="n">'+p+'</span><button class="round" data-a="dec" data-i="'+i+'" aria-label="Undo one '+p+' qaza"'+(td[i]?'':' disabled')+'>−</button><span class="cnt" aria-live="polite">'+td[i]+'</span><button class="round add" data-a="inc" data-i="'+i+'" aria-label="Add one '+p+' qaza"'+(rem<=0?' disabled':'')+'>+</button></div>'});
h+='<p class="note" style="margin-top:8px">Tap + after you pray a qaza. Tap − to undo a mistake.</p></div>';
h+='<div class="card"><h2>Daily target</h2><div class="chips">';
[1,3,5,10].forEach(function(n){h+='<button class="chip" data-a="tg" data-n="'+n+'" aria-pressed="'+(S.target===n)+'">'+n+' per day</button>'});
var cu=[1,3,5,10].indexOf(S.target)<0;h+='<button class="chip" data-a="cu" aria-pressed="'+cu+'">Custom</button>'+(cu||window._cu?'<input id="cust" type="number" min="1" inputmode="numeric" value="'+S.target+'" aria-label="Custom daily target">':'')+'</div></div>';
var ks=Object.keys(S.log).sort().reverse().slice(0,14);
h+='<div class="card"><h2>History</h2>';
if(!ks.length)h+='<p class="empty">No prayers logged yet. Your first tick will show up here.</p>';
else{h+='<div class="hist h"><div>Date</div>'+P.map(function(p){return '<div>'+p.slice(0,3)+'</div>'}).join('')+'<div>All</div></div>';
ks.forEach(function(k){var a=S.log[k],d=new Date(k+"T00:00:00");h+='<div class="hist"><div>'+d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+'</div>'+a.map(function(x){return '<div>'+(x||'·')+'</div>'}).join('')+'<div><b>'+sum(a)+'</b></div></div>'})}
h+='</div><div class="foot">'+(confirmReset?'<button class="btn-p" data-a="reset2">Yes, erase everything</button><button data-a="no">Keep my data</button>':'<button class="link" data-a="reset">Reset all data</button>')+'</div><p class="note">Your progress is stored in this browser only. Clearing site data will remove it.</p>';
return h}
function render(){var a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;var el=document.getElementById("app");el.innerHTML=(!S.setup||editing)?setupView():dashView();
if(id){var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}}
document.addEventListener("input",function(e){var t=e.target;if(t.dataset.f){calc[t.dataset.f]=t.value;
var c=computed(),pv=document.querySelector(".preview");if(pv){pv.querySelector(".big").textContent=fmt(c.total);pv.querySelectorAll(".lbl")[1].textContent=calc.manual!==""?"Manual total":(Math.round(c.years*100)/100)+" years × 365 days × 5 prayers";var b=document.querySelector('[data-a="start"]');if(b)b.disabled=c.total<=0}}
if(t.id==="cust"){var v=Math.max(1,parseInt(t.value)||1);S.target=v;save();var p=document.querySelector(".lbl");}});
document.addEventListener("change",function(e){if(e.target.id==="cust")render()});
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,i=+b.dataset.i;
if(a==="inc")bump(i,1);else if(a==="dec")bump(i,-1);
else if(a==="tg"){S.target=+b.dataset.n;window._cu=false;save();render()}
else if(a==="cu"){window._cu=true;render();var c=document.getElementById("cust");if(c)c.focus()}
else if(a==="start"){S.total=computed().total;S.prior=Math.round(num(calc.done));S.setup=true;editing=false;save();render()}
else if(a==="edit"){editing=true;calc.manual=String(S.total);calc.done=String(S.prior||0);render()}
else if(a==="cancel"){editing=false;render()}
else if(a==="reset"){confirmReset=true;render()}
else if(a==="no"){confirmReset=false;render()}
else if(a==="reset2"){S={setup:false,total:0,target:5,log:{}};calc={obl:"",cur:"",ex:"0",done:"0",manual:""};confirmReset=false;save();render()}});
render();
})();
</script>
</body>
</html>
